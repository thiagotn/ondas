# packages/web/nginx.conf
# nginx servindo a PWA estática em :8080 (non-root), atrás do Traefik, que recebe do
# Cloudflare Tunnel. Nenhum hostname aparece aqui: trocar de domínio não toca nesta imagem.
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on; tcp_nopush on; server_tokens off;

    # O manifesto da PWA precisa do tipo certo para o browser aceitar a instalação.
    types {
        application/manifest+json  webmanifest;
    }

    # Redirects relativos: o nginx escuta em :8080 atrás do Traefik. Sem isto, qualquer
    # redirect vazaria a porta interna no Location e o browser tentaria uma porta que não
    # existe do lado de fora.
    absolute_redirect off;
    port_in_redirect off;

    gzip on; gzip_vary on; gzip_min_length 1024; gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml
               application/manifest+json;

    # Quem desembrulha link para mostrar prévia. Só esta lista é mandada para o
    # endereço de Open Graph da API; qualquer outro User-Agent recebe a SPA, como
    # sempre. É uma lista de robôs conhecidos, não uma tentativa de adivinhar
    # navegador — errar para o lado do app é o certo.
    map $http_user_agent $og_robo {
        default 0;
        "~*(facebookexternalhit|WhatsApp|TelegramBot|Twitterbot|Discordbot|Slackbot|LinkedInBot|SkypeUriPreview|redditbot|Pinterest|Applebot|Googlebot|bingbot|Mastodon|Bluesky|vkShare|Iframely|embedly)" 1;
    }

    log_format main '$remote_addr - $status "$request" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Headers de segurança no nível do server. O nginx só os herda em locations sem
        # add_header próprio — por isso o cache abaixo usa `expires`, nunca add_header.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

        # Service worker: NUNCA cacheado. Um sw.js velho em cache prende o usuário numa
        # versão antiga do app, porque é ele quem decide o que servir offline.
        location = /sw.js {
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
        }
        location = /registerSW.js { expires -1; add_header Cache-Control "no-cache" always; }

        # Manifesto e ícones: revalida rápido, para trocar nome/ícone sem esperar cache.
        location = /manifest.webmanifest { expires 1h; }
        location ^~ /icons/ { expires 7d; access_log off; try_files $uri =404; }

        # Bundles do Vite: o nome carrega hash do conteúdo, então nunca mudam de conteúdo.
        location ^~ /assets/ { expires 1y; access_log off; try_files $uri =404; }

        # Demais assets versionados pelo build.
        location ~* \.(css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|avif|ico)$ {
            expires 30d;
            access_log off;
            try_files $uri =404;
        }

        # HTML sem cache agressivo: é a porta de entrada e muda a cada deploy.
        location = /index.html { expires -1; }

        # Endereço da faixa (/t/<slug>-<id>): o link que se manda para alguém E a rota
        # do player cheio, que são a mesma coisa. Para gente é rota do React Router
        # como as outras; para robô de prévia é um 302 para a API, que responde as meta
        # tags daquela faixa — a PWA é estática e não teria como.
        #
        # Por ser também o player, esta rota passou a ser navegação quente, e não só
        # porta de entrada de link compartilhado: cada abertura do player cheio escreve
        # um /t/... aqui no access log.
        #
        # 302 e não proxy_pass: o nginx resolve upstream literal no START, então um
        # `proxy_pass http://ondas-api` derrubaria o pod da PWA em CrashLoop sempre que
        # o DNS da API falhasse. Hoje a API fora do ar degrada só o acervo, e tem de
        # continuar assim. O redirect reentra pelo Ingress, que já roteia /api — e esta
        # imagem segue sem saber o nome de nenhum serviço do cluster.
        #
        # `expires -1` e nunca add_header aqui: add_header no location mataria a herança
        # dos headers de segurança do server. E o no-cache é obrigatório — se a
        # Cloudflare guardar o 302 do robô, ela o serve para gente, e todo mundo cai na
        # página de prévia em vez do app.
        location ^~ /t/ {
            expires -1;
            if ($og_robo) { return 302 /api/og$uri; }
            try_files $uri /index.html;
        }

        # SPA: /search, /library/<recorte> e /login são rotas do React Router, não
        # arquivos.
        # O fallback para index.html é o que faz um reload direto nessas URLs funcionar.
        # Arquivos inexistentes com extensão caem nos locations acima e devolvem 404 de
        # verdade, em vez de entregar o HTML do app com status 200.
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }
    }
}
