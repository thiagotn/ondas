<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ondas</title>
    <meta name="description" content="Ondas — streaming de música independente com estética de terminal." />

    <!--
      As três versões do site, para o buscador saber que são a MESMA página em
      idiomas diferentes e não conteúdo duplicado. `x-default` aponta para a
      raiz, que é onde quem não casa com nenhuma cai — e é o português.

      Os links são relativos porque esta imagem não conhece o próprio domínio:
      é a mesma restrição que o `nginx.conf` se impõe (`absolute_redirect
      off`), e o crawler resolve contra a URL corrente.
    -->
    <link rel="alternate" hreflang="pt-BR" href="/" />
    <link rel="alternate" hreflang="en" href="/en/" />
    <link rel="alternate" hreflang="es" href="/es/" />
    <link rel="alternate" hreflang="x-default" href="/" />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ondas" />
    <!--
      O `?v=2` é a versão da MARCA, e não enfeite. Estes arquivos têm nome fixo
      e cache longo (7 a 30 dias, no nginx.conf e na borda da Cloudflare): sem
      mudar o endereço, trocar o logo deixa o ícone antigo no ar por semanas —
      foi o que aconteceu na troca da fita pela onda. Mudou a marca, suba o
      número aqui, nos manifests (vite.config.ts e public/manifest-*.webmanifest)
      e em scripts/gen-splash.mjs.
    -->
    <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png?v=2" sizes="32x32" />
    <link rel="icon" href="/icons/favicon-16.png?v=2" sizes="16x16" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png?v=2" />

    <!--
      Telas de abertura do iOS. O Safari só usa a que casar exatamente com o
      aparelho, por isso a lista longa. Imagens e tags saem de
      `scripts/gen-splash.mjs` — edite a tabela de lá, não esta lista.
    -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/splash-750x1334.png?v=2" />

    <script>
      /**
       * O idioma, antes do primeiro paint.
       *
       * Um HTML serve os três idiomas, então `lang`, a descrição e o manifest
       * não podem ser estáticos — e esperar o bundle deixaria o crawler (e o
       * leitor de tela) vendo `pt-BR` numa página em espanhol. O prefixo do
       * caminho é a fonte: `/en/...`, `/es/...`, e a raiz é o português.
       *
       * Isto duplica a decisão que `app/idioma.ts` toma para o React. A
       * duplicação é o preço de não ter um build por idioma, e os dois
       * concordam porque ambos leem a MESMA coisa: o primeiro segmento.
       */
      (function () {
        var m = location.pathname.match(/^\/(en|es)(\/|$)/);
        if (!m) return;
        var lang = m[1];
        document.documentElement.lang = lang;
        var d = {
          en: 'Music player with a terminal aesthetic, with offline tracks.',
          es: 'Reproductor de música con estética de terminal, con pistas offline.',
        }[lang];
        var meta = document.querySelector('meta[name="description"]');
        if (meta && d) meta.setAttribute('content', d);
        var man = document.querySelector('link[rel="manifest"]');
        if (man) man.setAttribute('href', '/manifest-' + lang + '.webmanifest');
      })();
    </script>

    <script>
      /**
       * Aplica o tema salvo antes do primeiro paint: sem isto a tela pisca no
       * tema padrão. Mantém a mesma derivação de `themeCssVars()` em `core`.
       */
      (function () {
        var T = {
          nocturne: ['#161826', '#e9e9ed', '#9184d9'],
          'catppuccin-mocha': ['#1e1e2e', '#cdd6f4', '#cba6f7'],
          tokyonight: ['#1a1b26', '#c0caf5', '#7aa2f7'],
          dracula: ['#282a36', '#f8f8f2', '#bd93f9'],
          'gruvbox-dark': ['#282828', '#ebdbb2', '#fabd2f'],
          nord: ['#2e3440', '#d8dee9', '#88c0d0'],
          'rose-pine': ['#191724', '#e0def4', '#ebbcba'],
          'solarized-dark': ['#002b36', '#93a1a1', '#268bd2'],
          'github-light': ['#ffffff', '#24292f', '#0969da'],
        };
        var id = 'catppuccin-mocha';
        try {
          var saved = localStorage.getItem('ondas-theme');
          if (saved && T[saved]) id = saved;
        } catch (e) {}
        var t = T[id];
        var r = document.documentElement.style;
        r.setProperty('--color-bg', t[0]);
        r.setProperty('--color-text', t[1]);
        r.setProperty('--color-accent', t[2]);
        r.setProperty('--color-surface', 'color-mix(in oklab, ' + t[1] + ' 6%, ' + t[0] + ')');
        document.documentElement.style.colorScheme = id === 'github-light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = id;
        var meta = document.querySelector('meta[name=theme-color]');
        if (meta) meta.setAttribute('content', t[0]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
