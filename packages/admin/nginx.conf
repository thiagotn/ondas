# packages/admin/nginx.conf
# nginx servindo o painel de admin em :8080 (non-root), atrás do Traefik. Como o
# da PWA, não conhece hostname nenhum e não faz proxy: o `/api/admin` deste host
# é roteado pelo Ingress, direto para a API.
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile on; tcp_nopush on; server_tokens off;

    absolute_redirect off;
    port_in_redirect off;

    gzip on; gzip_vary on; gzip_min_length 1024; gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    log_format main '$remote_addr - $status "$request" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Headers no nível do server, e NENHUM add_header em location: o nginx
        # só os herda onde não há add_header próprio (mesma regra do da PWA).
        #
        # A CSP é mais fechada que a da PWA porque aqui dá para ser: tudo é
        # servido desta origem, não há mídia de fora nem service worker. É a
        # segunda camada contra o texto não confiável que o painel mostra
        # (mensagem de pedido de conta, título de faixa) — a primeira é o React
        # nunca desenhá-lo como HTML. `style-src` aceita inline porque os tokens
        # de tema são escritos em `style` pelo próprio app.
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

        # Arquivos com hash no nome: imutáveis.
        location /assets/ { expires 1y; try_files $uri =404; }

        # O index nunca fica em cache: é ele que aponta para os assets da versão
        # atual. `expires -1` e não add_header, para não derrubar os de cima.
        location / {
            expires -1;
            try_files $uri /index.html;
        }
    }
}
