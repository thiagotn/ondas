name: Build and push container image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'design_handoff_ondas_terminal_player/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Portões de qualidade antes de publicar imagem: tipos, regras de domínio e o smoke da PWA.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Testes de domínio (Vitest em @ondas/core)
        run: pnpm test

      - name: Instalar Chromium do Playwright
        run: pnpm --filter @ondas/web exec playwright install --with-deps chromium

      - name: Smoke da PWA (Playwright)
        run: pnpm test:e2e

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: api/go.sum

      - name: Testes da API (Go)
        run: go test ./...
        working-directory: api

      - name: Guardar o relatório quando o smoke falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/web/playwright-report
          retention-days: 7

  # Duas imagens: a PWA estática e a API do acervo. A matriz mantém um job só
  # para as duas, e o write-back abaixo acontece uma vez, com as duas tags.
  build-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: ondas
            context: .
            dockerfile: Dockerfile
          - name: ondas-api
            context: api
            dockerfile: api/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # GitOps: após publicar a imagem, atualiza a tag no repo homelab (privado) e dá push.
  # O Argo CD detecta o commit e faz o rollout — o cluster NÃO recebe nada deste CI (read-only).
  # Credencial: deploy key de ESCRITA do homelab, em secrets.HOMELAB_DEPLOY_KEY (escopada ao repo).
  bump-homelab-tag:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homelab (deploy key SSH)
        uses: actions/checkout@v4
        with:
          repository: thiagotn/homelab
          ssh-key: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          path: homelab

      - name: Atualizar newTag no kustomization e dar push
        working-directory: homelab
        run: |
          set -euo pipefail
          TAG="sha-${GITHUB_SHA}"
          # Seleção por nome, não por posição: com duas imagens no mesmo
          # kustomization, `.images[0]` viraria uma roleta e um dia escreveria
          # a tag da PWA na API.
          for IMG in ondas ondas-api; do
            yq -i "(.images[] | select(.name == \"ghcr.io/thiagotn/${IMG}\")).newTag = \"${TAG}\"" \
              helm/apps/ondas/kustomization.yaml
          done
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/apps/ondas/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Tag já é ${TAG}; nada a commitar."
          else
            git commit -m "deploy(ondas): ${TAG} (pwa + api) [skip ci]"
            git push
          fi
