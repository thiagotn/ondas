<!DOCTYPE html>
<html lang="pt-BR" data-tema="gruvbox-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ondas — do link no Telegram ao acervo</title>
<meta name="description" content="Passo a passo interativo da ingestão do Ondas: o link chega no Telegram, atravessa a API, a fila, a trava de SSRF, o R2, e termina tocando na PWA.">
<style>
/* ---------------------------------------------------------------------------
   Tokens. Mesma ideia do app: cada tema declara bg, fg, accent e os 8 ANSI, e
   todo o resto sai de `color-mix(in oklab, ...)`. A lista de temas é a de
   `packages/core/src/themes.ts`, para esta página não envelhecer sozinha.
   --------------------------------------------------------------------------- */
:root {
  --bg: #282828; --fg: #ebdbb2; --accent: #fabd2f;
  --a0: #3c3836; --a1: #fb4934; --a2: #b8bb26; --a3: #fabd2f;
  --a4: #83a598; --a5: #d3869b; --a6: #8ec07c; --a7: #a89984;

  --surface:  color-mix(in oklab, var(--bg) 88%, var(--fg));
  --surface2: color-mix(in oklab, var(--bg) 80%, var(--fg));
  --linha:    color-mix(in oklab, var(--bg) 70%, var(--fg));
  --fraco:    color-mix(in oklab, var(--fg) 55%, var(--bg));
  --fraquin:  color-mix(in oklab, var(--fg) 34%, var(--bg));

  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "DejaVu Sans Mono", monospace;
  --r: 4px;
}

* { box-sizing: border-box; }

html { color-scheme: dark; }
html[data-tema="github-light"] { color-scheme: light; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 13px/1.6 var(--mono);
  -webkit-text-size-adjust: 100%;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* ------------------------------- barra -------------------------------- */
.barra {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--linha);
  flex-wrap: wrap;
}
.marca { color: var(--accent); font-weight: 700; }
.rota  { color: var(--fraco); }
.barra .espaco { flex: 1; }

.cenarios { display: flex; gap: 2px; flex-wrap: wrap; }
.cenarios button {
  padding: 5px 11px; border-radius: var(--r);
  color: var(--fraco); white-space: nowrap;
}
.cenarios button:hover { color: var(--fg); background: var(--surface2); }
.cenarios button[aria-pressed="true"] { color: var(--bg); background: var(--accent); }

.pilula {
  padding: 5px 10px; border: 1px solid var(--linha);
  border-radius: var(--r); color: var(--fraco); white-space: nowrap;
}
.pilula:hover { color: var(--fg); border-color: var(--fraco); }

/* ------------------------------- palco -------------------------------- */
.palco {
  padding: 14px 16px 0;
  overflow-x: auto;
}
svg { display: block; width: 100%; min-width: 820px; height: auto; }

/* O padrão é o estado APAGADO: nó que o cenário não toca é cenário de fundo.
   Visitado fica legível, e só o ativo tem cor. */
.caixa      { fill: var(--surface); stroke: var(--linha); stroke-width: 1; rx: 4; }
.caixa-rot  { fill: var(--fraco); font: 600 13px var(--mono); }
.caixa-sub  { fill: var(--fraquin); font: 11px var(--mono); }

/* O nó aceso é o único com cor. Tudo o mais fica legível, mas apagado:
   o olho tem de achar o passo atual sem procurar. */
g.no.ativo .caixa     { fill: color-mix(in oklab, var(--accent) 22%, var(--bg));
                        stroke: var(--accent); stroke-width: 1.5; }
g.no.ativo .caixa-rot { fill: var(--accent); }
g.no.ativo .caixa-sub { fill: color-mix(in oklab, var(--accent) 70%, var(--fg)); }

g.no.falhou .caixa     { fill: color-mix(in oklab, var(--a1) 22%, var(--bg));
                         stroke: var(--a1); stroke-width: 1.5; }
g.no.falhou .caixa-rot { fill: var(--a1); }

g.no.visitado .caixa     { stroke: var(--fraco); }
g.no.visitado .caixa-rot { fill: var(--fg); }

.aresta      { fill: none; stroke: var(--linha); stroke-width: 1.5; }
.aresta.viva { stroke: var(--accent); stroke-width: 2; }
.aresta.viva.ruim { stroke: var(--a1); }
.aresta.usada { stroke: var(--fraco); }

.pacote { fill: var(--accent); }
.pacote.ruim { fill: var(--a1); }

.rotulo-aresta { fill: var(--fraquin); font: 10px var(--mono); }
.rotulo-aresta.viva { fill: var(--accent); }

/* ----------------------------- controles ------------------------------ */
.controles {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; flex-wrap: wrap;
  border-bottom: 1px solid var(--linha);
}
.controles .bt {
  padding: 6px 13px; border: 1px solid var(--linha); border-radius: var(--r);
}
.controles .bt:hover { border-color: var(--fraco); background: var(--surface); }
.controles .bt.principal {
  background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700;
}
.controles .contador { color: var(--fraco); margin-left: auto; }
.controles label { color: var(--fraquin); display: flex; align-items: center; gap: 6px; }
input[type=range] { accent-color: var(--accent); width: 96px; }

/* ------------------------------ colunas ------------------------------- */
.colunas {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  border-bottom: 1px solid var(--linha);
}
.colunas > section { padding: 14px 16px; min-height: 230px; }
.detalhe { border-right: 1px solid var(--linha); }

.detalhe h2 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
.detalhe h2 .n { color: var(--fraquin); margin-right: 8px; }
.detalhe p { margin: 0 0 10px; color: var(--fg); }
.detalhe .ref {
  display: inline-block; padding: 2px 7px; margin-bottom: 10px;
  background: var(--surface2); border-radius: var(--r);
  color: var(--a4); font-size: 12px;
}
.detalhe .risco {
  border-left: 2px solid var(--a1); padding: 2px 0 2px 10px;
  color: var(--fraco); font-size: 12px;
}
.detalhe .risco b { color: var(--a1); font-weight: 600; }

/* ------------------------------ console ------------------------------- */
.console h3 {
  margin: 0 0 8px; font-size: 11px; color: var(--fraquin);
  text-transform: uppercase; letter-spacing: .08em; font-weight: 600;
}
/* Rola por dentro em vez de empurrar a página: é o que faz o `scrollTop`
   do script levar a linha nova para a vista. */
.console ol {
  margin: 0; padding: 0; list-style: none; font-size: 12px;
  max-height: 196px; overflow-y: auto; overscroll-behavior: contain;
}
.console li { display: flex; gap: 10px; padding: 1px 0; color: var(--fraco); }
.console li .hora { color: var(--fraquin); flex-shrink: 0; }
.console li.nova  { color: var(--fg); }
.console li.ruim  { color: var(--a1); }
.console li.bom   { color: var(--a2); }

/* ------------------------------ trilha -------------------------------- */
.trilha { display: flex; flex-wrap: wrap; gap: 2px; padding: 12px 16px; }
.trilha button {
  min-width: 30px; padding: 5px 7px; border-radius: var(--r);
  color: var(--fraquin); font-size: 12px;
}
.trilha button:hover { color: var(--fg); background: var(--surface); }
.trilha button.visitado { color: var(--fraco); }
.trilha button[aria-current="step"] {
  background: var(--accent); color: var(--bg); font-weight: 700;
}

footer {
  padding: 14px 16px 28px; color: var(--fraquin); font-size: 12px;
  border-top: 1px solid var(--linha);
}
footer a { color: var(--a4); }

@media (max-width: 760px) {
  .colunas { grid-template-columns: 1fr; }
  .detalhe { border-right: 0; border-bottom: 1px solid var(--linha); }
  .colunas > section { min-height: 0; }
  .barra { gap: 8px; }
}
@media (prefers-reduced-motion: reduce) {
  .pacote { display: none; }
}
</style>
</head>

</main>

<footer id="rodape"></footer>

const $ = (id) => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';

let lang = 'pt';
let tema = 4;                 // gruvbox-dark
let cenario = 'media';
let i = 0;                    // passo atual
let tocando = false;
let relogio = null;
let anim = null;
let base = Date.UTC(2026, 9, 21, 17, 32, 18) / 1000;

const L = (o) => (o && typeof o === 'object' && !Array.isArray(o)) ? (o[lang] ?? o.pt) : o;
const passos = () => CENARIOS[cenario].passos;
const atual  = () => passos()[i];

/* ----------------------------- tema ----------------------------- */
function aplicarTema() {
  const [id, bg, fg, ac, ansi] = TEMAS[tema];
  const r = document.documentElement.style;
  r.setProperty('--bg', bg); r.setProperty('--fg', fg); r.setProperty('--accent', ac);
  ansi.forEach((c, n) => r.setProperty('--a' + n, c));
  document.documentElement.dataset.tema = id;
  $('bt-tema').textContent = id;
}

/* ----------------------------- palco ----------------------------- */
function montarPalco() {
  const gA = $('arestas'), gR = $('rotulos'), gN = $('nos');
  gA.textContent = ''; gR.textContent = ''; gN.textContent = '';

  for (const [id, a] of Object.entries(ARESTAS)) {
    const p = document.createElementNS(SVGNS, 'path');
    p.setAttribute('d', a.d);
    p.setAttribute('class', 'aresta');
    p.setAttribute('marker-end', 'url(#seta)');
    p.dataset.id = id;
    gA.appendChild(p);

    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('x', a.rx); t.setAttribute('y', a.ry);
    t.setAttribute('class', 'rotulo-aresta');
    t.setAttribute('text-anchor', a.anc || 'middle');
    t.textContent = L(a.rot);
    t.dataset.id = id;
    gR.appendChild(t);
  }

  for (const [id, n] of Object.entries(NOS)) {
    const g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'no'); g.dataset.id = id;

    const r = document.createElementNS(SVGNS, 'rect');
    r.setAttribute('x', n.x); r.setAttribute('y', n.y);
    r.setAttribute('width', n.w); r.setAttribute('height', n.h);
    r.setAttribute('rx', 4); r.setAttribute('class', 'caixa');
    g.appendChild(r);

    const t1 = document.createElementNS(SVGNS, 'text');
    t1.setAttribute('x', n.x + n.w / 2); t1.setAttribute('y', n.y + 23);
    t1.setAttribute('text-anchor', 'middle'); t1.setAttribute('class', 'caixa-rot');
    t1.textContent = L(n.rot);
    g.appendChild(t1);

    const t2 = document.createElementNS(SVGNS, 'text');
    t2.setAttribute('x', n.x + n.w / 2); t2.setAttribute('y', n.y + 40);
    t2.setAttribute('text-anchor', 'middle'); t2.setAttribute('class', 'caixa-sub');
    t2.textContent = L(n.sub);
    g.appendChild(t2);

    gN.appendChild(g);
  }
  $('palco-tit').textContent = L(UI.titPalco);
}

/* Quais nós/arestas já foram tocados até o passo n — é o que dá o rastro. */
function rastro(n) {
  const nos = new Set(), ar = new Set();
  for (let k = 0; k <= n && k < passos().length; k++) {
    const p = passos()[k];
    if (p.no) nos.add(p.no);
    if (p.aresta) ar.add(p.aresta);
  }
  return { nos, ar };
}

function pintarPalco() {
  const p = atual();
  const r = rastro(i - 1);

  for (const g of $('nos').children) {
    const id = g.dataset.id;
    g.classList.toggle('ativo', id === p.no && !p.ruim);
    g.classList.toggle('falhou', id === p.no && !!p.ruim);
    g.classList.toggle('visitado', id !== p.no && r.nos.has(id));
  }
  for (const e of $('arestas').children) {
    const id = e.dataset.id;
    e.classList.toggle('viva', id === p.aresta);
    e.classList.toggle('ruim', id === p.aresta && !!p.ruim);
    e.classList.toggle('usada', id !== p.aresta && r.ar.has(id));
  }
  for (const t of $('rotulos').children) {
    t.classList.toggle('viva', t.dataset.id === p.aresta);
  }
}

/* O pacote anda pela aresta com getPointAtLength: controle total, sem depender
   de animação declarativa que não dá para rebobinar. */
function correrPacote(p) {
  cancelarPacote();
  const bola = $('pacote');
  if (!p.aresta) { bola.style.display = 'none'; return; }
  const path = [...$('arestas').children].find((e) => e.dataset.id === p.aresta);
  if (!path) { bola.style.display = 'none'; return; }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const total = path.getTotalLength();
  const dur = Math.max(260, (p.dt || 1100) / velocidade() * 0.72);
  const inverso = p.dir === -1;
  bola.classList.toggle('ruim', !!p.ruim);
  bola.style.display = '';

  const t0 = performance.now();
  const quadro = (t) => {
    const u = Math.min(1, (t - t0) / dur);
    const pt = path.getPointAtLength((inverso ? 1 - u : u) * total);
    bola.setAttribute('cx', pt.x); bola.setAttribute('cy', pt.y);
    if (u < 1) anim = requestAnimationFrame(quadro);
    else { bola.style.display = 'none'; anim = null; }
  };
  anim = requestAnimationFrame(quadro);
}
function cancelarPacote() {
  if (anim) { cancelAnimationFrame(anim); anim = null; }
  $('pacote').style.display = 'none';
}

/* ----------------------------- console ----------------------------- */
function hhmmss(seg) {
  const d = new Date(seg * 1000);
  return [d.getUTCHours(), d.getUTCMinutes(), d.getUTCSeconds()]
    .map((n) => String(n).padStart(2, '0')).join(':');
}

function pintarLog() {
  const ol = $('log');
  ol.textContent = '';
  let t = base;
  for (let k = 0; k <= i; k++) {
    for (const linha of (passos()[k].log || [])) {
      t += 1 + (k % 3);
      const li = document.createElement('li');
      if (k === i) li.classList.add('nova');
      if (linha.k) li.classList.add(linha.k);
      const h = document.createElement('span');
      h.className = 'hora'; h.textContent = hhmmss(t);
      const m = document.createElement('span');
      m.textContent = L(linha);
      li.append(h, m);
      ol.appendChild(li);
    }
  }
  ol.scrollTop = ol.scrollHeight;
}

/* ----------------------------- trilha ----------------------------- */
function montarTrilha() {
  const nav = $('trilha');
  nav.textContent = '';
  passos().forEach((_, n) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = String(n + 1).padStart(2, '0');
    b.addEventListener('click', () => { parar(); ir(n); });
    nav.appendChild(b);
  });
}
function pintarTrilha() {
  [...$('trilha').children].forEach((b, n) => {
    b.classList.toggle('visitado', n < i);
    if (n === i) b.setAttribute('aria-current', 'step');
    else b.removeAttribute('aria-current');
  });
}

/* ----------------------------- detalhe ----------------------------- */
function pintarDetalhe() {
  const p = atual();
  $('d-num').textContent = String(i + 1).padStart(2, '0');
  // `tit` e `corpo` são TEXTO PURO: vão por textContent porque carregam `<audio>`,
  // `u/<dono>/a/<id>.<ext>` e afins, que innerHTML comeria. Ênfase só em `risco`,
  // que é o único pintado como HTML — e lá todo < literal vai escapado.
  $('d-tit').textContent = L(p.tit);
  $('d-corpo').textContent = L(p.corpo);
  $('d-ref').textContent = p.ref;
  $('d-risco').innerHTML = '<b>' + L(UI.risco) + ' — </b>' + L(p.risco);
  $('contador').textContent = UI.contador[lang](i + 1, passos().length);
}

/* ----------------------------- navegação ----------------------------- */
function ir(n) {
  i = Math.max(0, Math.min(passos().length - 1, n));
  pintarPalco(); pintarDetalhe(); pintarLog(); pintarTrilha();
  correrPacote(atual());
}
const velocidade = () => Number($('vel').value) || 3;

function agendar() {
  clearTimeout(relogio);
  if (!tocando) return;
  const dur = (atual().dt || 1100) / velocidade() * 1.6;
  relogio = setTimeout(() => {
    if (i >= passos().length - 1) { parar(); return; }
    ir(i + 1);
    agendar();
  }, dur);
}
function tocar() {
  if (i >= passos().length - 1) ir(0);
  tocando = true;
  $('bt-tocar').textContent = L(UI.pausar);
  agendar();
}
function parar() {
  tocando = false;
  clearTimeout(relogio);
  $('bt-tocar').textContent = L(UI.tocar);
}
function trocarCenario(c) {
  parar(); cenario = c; i = 0;
  montarTrilha(); pintarCenarios(); ir(0);
}

function pintarCenarios() {
  const nav = $('cenarios');
  nav.textContent = '';
  for (const [id, c] of Object.entries(CENARIOS)) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = L(c.nome);
    b.setAttribute('aria-pressed', String(id === cenario));
    b.addEventListener('click', () => trocarCenario(id));
    nav.appendChild(b);
  }
}

/* ----------------------------- idioma ----------------------------- */
function pintarIdioma() {
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  $('bt-idioma').textContent = lang === 'pt' ? 'EN' : 'PT';
  $('rota').textContent = L(UI.rota);
  $('bt-passo').textContent = L(UI.passo);
  $('bt-voltar').textContent = L(UI.volta);
  $('rot-vel').textContent = L(UI.vel);
  $('rot-console').textContent = L(UI.console);
  $('bt-tocar').textContent = tocando ? L(UI.pausar) : L(UI.tocar);
  $('rodape').innerHTML = L(UI.rodape);
}

/* ----------------------------- eventos ----------------------------- */
$('bt-tocar').addEventListener('click', () => tocando ? parar() : tocar());
$('bt-passo').addEventListener('click', () => { parar(); ir(i + 1); });
$('bt-voltar').addEventListener('click', () => { parar(); ir(i - 1); });
$('bt-zerar').addEventListener('click', () => { parar(); ir(0); });
$('vel').addEventListener('input', () => { if (tocando) agendar(); });
$('bt-tema').addEventListener('click', () => { tema = (tema + 1) % TEMAS.length; aplicarTema(); });
$('bt-idioma').addEventListener('click', () => {
  lang = lang === 'pt' ? 'en' : 'pt';
  pintarIdioma(); montarPalco(); pintarCenarios(); ir(i);
});

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'j') { parar(); ir(i + 1); }
  else if (e.key === 'ArrowLeft' || e.key === 'k') { parar(); ir(i - 1); }
  else if (e.key === ' ') { e.preventDefault(); tocando ? parar() : tocar(); }
  else if (e.key === 'r') { parar(); ir(0); }
  else return;
});

/* ----------------------------- início ----------------------------- */
aplicarTema();
pintarIdioma();
montarPalco();
pintarCenarios();
montarTrilha();
ir(0);
</script>
</body>
</html>
